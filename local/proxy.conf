# Local stand-in for the ALB: one port, path-based routing, 404 for anything else.
server {
  listen 8080;

  # Docker's internal DNS. Re-resolving every 5s means a redeployed (recreated)
  # container is picked up, like ALB target groups follow new ECS tasks.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $orders_api http://orders-api:8000;
  set $notify_svc http://notify-svc:3000;

  # Like the ALB: keep the client's Host header and say the original scheme.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /orders  { proxy_pass $orders_api; }
  location /orders/   { proxy_pass $orders_api; }
  location = /notify  { proxy_pass $notify_svc; }
  location /notify/   { proxy_pass $notify_svc; }

  location / {
    default_type application/json;
    return 404 '{"error":"not found"}';
  }
}
