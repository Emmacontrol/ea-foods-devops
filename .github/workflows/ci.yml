# Pull request checks: lint, test, build + scan images, static Terraform checks, terraform plan.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TERRAFORM_VERSION: 1.17.2

jobs:
  # ------------------------------------------------------------------ apps
  orders-api:
    name: orders-api · lint + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/orders-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/orders-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  notify-svc:
    name: notify-svc · lint + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/notify-svc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/notify-svc/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ------------------------------------------------------------------ images
  image:
    name: ${{ matrix.service }} · build + scan
    needs: [orders-api, notify-svc]
    runs-on: ubuntu-24.04-arm # native ARM64 build, matches Graviton Fargate
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, notify-svc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/${{ matrix.service }}/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore # time-boxed, justified exceptions only

  # ------------------------------------------------------------------ security
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ terraform
  terraform-static:
    name: terraform · fmt, validate, tflint, checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/envs/staging infra/envs/production; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --chdir infra --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra
          framework: terraform
          quiet: true

  terraform-plan:
    name: terraform plan · ${{ matrix.environment }}
    needs: terraform-static
    # Runs once infra/bootstrap is applied and its outputs are set as repository variables.
    # (Fork PRs get no OIDC token, so they stop at the static checks.)
    if: vars.TF_STATE_BUCKET != '' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC -> read-only plan role
      pull-requests: write # post the plan as a PR comment
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      DIR: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir="$DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: terraform plan
        # -lock=false: a read-only PR plan must never block a real deploy holding the lock.
        run: |
          terraform -chdir="$DIR" plan -input=false -lock=false -no-color \
            -var "image_tag=${{ github.event.pull_request.head.sha || github.sha }}" -out=tfplan
          terraform -chdir="$DIR" show -no-color tfplan > "plan-${{ matrix.environment }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.environment }}
          path: plan-${{ matrix.environment }}.txt
      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = fs.readFileSync(`plan-${env}.txt`, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see artifact)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, full plan in the workflow artifact';
            const body = `${marker}\n### Terraform plan · \`${env}\`\n**${summary}**\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
